<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LINDENBERG — Controle de Acesso</title>
<style>
  button, .btn, .chip, .autocomplete-item, tr.clickable, .actions-btn{
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}
:root{
  --bordo:#7F1D26; --bordo2:#8B1D25; --grafite:#1A1A1A;
  --branco:#fff; --fundo:#F5F5F5; --texto:#333; --texto2:#666;
  --verde-bg:#E6F4EA; --verde-tx:#1E7E34; --vermelho-bg:#FDE7E7; --vermelho-tx:#C0392B;
  --borda:#E5E5E5; --sombra:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.06);
  --raio:8px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--fundo);color:var(--texto);font-size:14px}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,select,textarea{font-family:inherit;font-size:14px;width:100%;padding:10px 12px;border:1px solid var(--borda);border-radius:var(--raio);outline:none;background:var(--branco);color:var(--texto)}
input:focus,select:focus,textarea:focus{border-color:var(--bordo)}
label{display:block;font-size:12px;font-weight:600;color:var(--texto2);margin-bottom:6px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:var(--raio);font-weight:600;font-size:14px;transition:.15s;white-space:nowrap}
.btn-primary{background:var(--bordo);color:#fff}
.btn-primary:hover{background:var(--bordo2)}
.btn-outline{background:transparent;border:1px solid var(--bordo);color:var(--bordo)}
.btn-outline:hover{background:#f7ecec}
.btn-ghost{color:var(--texto2)}
.btn-ghost:hover{background:#eee}
.btn-green{background:var(--verde-bg);color:var(--verde-tx)}
.btn-red{background:var(--vermelho-bg);color:var(--vermelho-tx)}
.btn-sm{padding:6px 12px;font-size:13px}
/* LOGIN */
#login{display:flex;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,var(--grafite),#2c2c2c)}
.login-card{background:var(--branco);padding:40px;border-radius:12px;width:360px;box-shadow:0 10px 40px rgba(0,0,0,.3);text-align:center}
.login-card .logo{width:200px;margin:0 auto 24px;display:block}
.login-card h1{color:var(--bordo);font-size:20px;margin-bottom:4px}
.login-card p{color:var(--texto2);font-size:13px;margin-bottom:24px}
.login-card .field{margin-bottom:14px;text-align:left}
.login-card .dica{margin-top:16px;font-size:12px;color:var(--texto2);background:var(--fundo);padding:10px;border-radius:var(--raio)}
/* LAYOUT */
#app{display:none}
.layout{display:flex;min-height:100vh}
/* SIDEBAR */
.sidebar{width:250px;background:var(--grafite);color:#fff;position:fixed;top:0;left:0;bottom:0;display:flex;flex-direction:column;z-index:100;transition:transform .25s}
.sidebar .logo-wrap{padding:24px 20px;border-bottom:1px solid #2c2c2c;text-align:center}
.sidebar .logo-wrap img{width:170px;max-width:100%;display:block;margin:0 auto}
.sidebar .logo-wrap .fallback{font-family:Georgia,serif;font-size:22px;letter-spacing:2px;color:#fff}
.sidebar .logo-wrap .fallback small{display:block;font-family:Inter,sans-serif;font-size:10px;letter-spacing:4px;color:#bbb;margin-top:4px}
.sidebar nav{flex:1;padding:16px 12px;overflow-y:auto}
.sidebar nav a{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:var(--raio);color:#d5d5d5;text-decoration:none;font-size:14px;margin-bottom:4px;transition:.15s}
.sidebar nav a:hover{background:#2c2c2c;color:#fff}
.sidebar nav a.active{background:var(--bordo);color:#fff;font-weight:600}
.sidebar .logout{padding:16px;border-top:1px solid #2c2c2c}
.sidebar .logout a{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:var(--raio);color:#d5d5d5;text-decoration:none}
.sidebar .logout a:hover{background:#2c2c2c;color:#fff}
.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:90}
.sidebar-overlay.show{display:block}
/* MAIN */
.main{flex:1;margin-left:250px;padding:24px 32px;min-height:100vh}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;flex-wrap:wrap;gap:12px}
.topbar h2{font-size:22px;color:var(--texto)}
.topbar .sub{color:var(--texto2);font-size:13px;margin-top:2px}
.topbar-right{display:flex;align-items:center;gap:16px}
.clock{text-align:right;font-size:13px;color:var(--texto2)}
.clock b{display:block;font-size:16px;color:var(--texto)}
.hamburger{display:none;background:var(--bordo);color:#fff;padding:8px 12px;border-radius:var(--raio);font-size:18px;margin-bottom:12px}
/* CARDS */
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
.card{background:var(--branco);border-radius:var(--raio);box-shadow:var(--sombra);padding:20px;border:1px solid var(--borda)}
.card .card-icon{font-size:22px;margin-bottom:10px;color:var(--bordo)}
.card .card-label{font-size:12px;color:var(--texto2);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.card .card-value{font-size:30px;font-weight:700;color:var(--texto);margin-top:4px}
.card .card-sub{font-size:12px;color:var(--texto2);margin-top:4px}
/* PANEL */
.panel{background:var(--branco);border-radius:var(--raio);box-shadow:var(--sombra);border:1px solid var(--borda);padding:20px;margin-bottom:24px}
.panel h3{font-size:16px;color:var(--texto);margin-bottom:16px;display:flex;align-items:center;gap:8px}
.panel-tools{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.search-box{position:relative;flex:1;min-width:220px}
.search-box input{padding-left:36px}
.search-box .icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--texto2)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:7px 14px;border-radius:20px;border:1px solid var(--borda);font-size:13px;color:var(--texto2);background:var(--branco)}
.chip.active{background:var(--bordo);color:#fff;border-color:var(--bordo)}
.chip-mini{padding:6px 12px;border-radius:16px;font-size:12px;font-weight:600;background:var(--fundo);color:var(--texto2);border:1px solid var(--borda);white-space:nowrap}
.chip-mini.green{background:var(--verde-bg);color:var(--verde-tx);border-color:transparent}
.chip-mini.red{background:var(--vermelho-bg);color:var(--vermelho-tx);border-color:transparent}
/* TABLE */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
thead th{text-align:left;font-size:12px;font-weight:600;color:var(--texto2);text-transform:uppercase;letter-spacing:.4px;padding:10px 12px;border-bottom:2px solid var(--borda);white-space:nowrap}
tbody td{padding:12px;border-bottom:1px solid var(--borda);font-size:14px;vertical-align:middle}
tbody tr:hover{background:#fafafa}
tbody tr.clickable{cursor:pointer}
tr.totais-row td{font-weight:700;background:#FAFAFA;border-top:2px solid var(--borda)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:600}
.pill-green{background:var(--verde-bg);color:var(--verde-tx)}
.pill-red{background:var(--vermelho-bg);color:var(--vermelho-tx)}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--bordo);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;overflow:hidden;flex-shrink:0}
.avatar img{width:100%;height:100%;object-fit:cover}
.actions-btn{color:var(--texto2);font-size:18px;padding:4px 8px;border-radius:4px}
.actions-btn:hover{background:#eee}
/* PAGINATION */
.pagination{display:flex;align-items:center;justify-content:space-between;margin-top:16px;flex-wrap:wrap;gap:12px}
.pagination .info{font-size:13px;color:var(--texto2)}
.pagination .pages{display:flex;gap:6px}
.pagination button{padding:7px 12px;border:1px solid var(--borda);border-radius:6px;background:var(--branco);color:var(--texto);font-size:13px}
.pagination button.active{background:var(--bordo);color:#fff;border-color:var(--bordo)}
.pagination button:disabled{opacity:.4;cursor:not-allowed}
/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:200;padding:16px}
.modal-overlay.open{display:flex}
.modal{background:var(--branco);border-radius:12px;width:520px;max-width:100%;max-height:90vh;overflow-y:auto;padding:24px}
.modal h3{font-size:18px;color:var(--texto);margin-bottom:20px}
.modal .field{margin-bottom:14px}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}
.photo-preview{width:80px;height:80px;border-radius:8px;background:var(--fundo);border:1px dashed var(--borda);display:flex;align-items:center;justify-content:center;overflow:hidden;margin-bottom:10px;color:var(--texto2);font-size:12px}
.photo-preview img{width:100%;height:100%;object-fit:cover}
.photo-btns{display:flex;gap:8px;flex-wrap:wrap}
video{width:100%;border-radius:8px;margin-bottom:10px;background:#000;min-height:200px}
/* TOAST */
.toast{position:fixed;bottom:20px;right:20px;background:var(--grafite);color:#fff;padding:12px 20px;border-radius:8px;box-shadow:0 4px 12px rgba(0,0,0,.3);z-index:300;opacity:0;transform:translateY(20px);transition:.3s;font-size:14px}
.toast.show{opacity:1;transform:translateY(0)}
.toast.success{background:var(--verde-tx)}
.toast.error{background:var(--vermelho-tx)}
/* DROPDOWN */
.dropdown{position:relative;display:inline-block}
.dropdown-menu{position:absolute;right:0;top:100%;background:var(--branco);border:1px solid var(--borda);border-radius:8px;box-shadow:0 4px 12px rgba(0,0,0,.15);min-width:150px;z-index:50;display:none;padding:4px}
.dropdown-menu.open{display:block}
.dropdown-menu button{display:block;width:100%;text-align:left;padding:9px 14px;font-size:13px;color:var(--texto)}
.dropdown-menu button:hover{background:var(--fundo)}
/* AUTOCOMPLETE */
.autocomplete{position:relative}
.autocomplete-list{position:absolute;top:100%;left:0;right:0;background:var(--branco);border:1px solid var(--borda);border-radius:8px;box-shadow:0 4px 12px rgba(0,0,0,.15);z-index:60;max-height:220px;overflow-y:auto;display:none;margin-top:2px}
.autocomplete-list.open{display:block}
.autocomplete-item{display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer;border-bottom:1px solid var(--fundo)}
.autocomplete-item:last-child{border-bottom:none}
.autocomplete-item:hover{background:var(--fundo)}
.autocomplete-item .ac-icon{font-size:18px;flex-shrink:0}
.autocomplete-item .ac-title{font-weight:600;font-size:14px;color:var(--texto)}
.autocomplete-item .ac-sub{font-size:12px;color:var(--texto2)}
.tipo-doc{display:flex;gap:8px}
.tipo-doc .chip{flex:1;justify-content:center}
/* TOALHAS */
.towel-grid{grid-template-columns:repeat(4,1fr)}
.towel-card .card-value{font-size:26px}
.towel-card .edit-icon{cursor:pointer;color:var(--bordo);font-size:14px;margin-left:6px}
.towel-card .edit-icon:hover{opacity:.7}
.month-selector{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.summary-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:24px}
.summary-block{border-radius:var(--raio);padding:18px}
.summary-block.green{background:var(--verde-bg)}
.summary-block.red{background:var(--vermelho-bg)}
.summary-block .sb-label{font-size:12px;font-weight:600;color:var(--texto2)}
.summary-block .sb-value{font-size:28px;font-weight:700;margin-top:4px}
.summary-block.green .sb-value{color:var(--verde-tx)}
.summary-block.red .sb-value{color:var(--vermelho-tx)}
.situacao-btns{display:flex;gap:12px;margin-top:8px}
.situacao-btns .btn{flex:1;justify-content:center;padding:14px;font-size:15px}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--borda);margin-bottom:16px}
.tabs button{padding:10px 18px;font-size:14px;color:var(--texto2);border-bottom:2px solid transparent;margin-bottom:-2px;font-weight:600}
.tabs button.active{color:var(--bordo);border-bottom-color:var(--bordo)}
.subtitulo-secao{font-size:14px;font-weight:700;color:var(--texto);margin:18px 0 10px}
/* PROFILE */
.profile-head{display:flex;gap:20px;align-items:center;margin-bottom:20px;flex-wrap:wrap}
.profile-info h2{font-size:20px;color:var(--texto)}
.profile-info p{color:var(--texto2);font-size:13px;margin-top:2px}
.profile-stats{display:flex;gap:24px;margin-top:12px;flex-wrap:wrap}
.profile-stats .stat{font-size:13px;color:var(--texto2)}
.profile-stats .stat b{display:block;font-size:20px;color:var(--texto)}
/* RELATORIOS */
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:16px}
.filters .field{margin:0}
/* RESPONSIVE */
@media(max-width:1024px){.cards{grid-template-columns:repeat(2,1fr)}.summary-grid{grid-template-columns:1fr}.towel-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:768px){
  .sidebar{transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0)}
  .hamburger{display:inline-flex}
  .main{margin-left:0;padding:16px}
  .cards{grid-template-columns:1fr 1fr}
  .towel-grid{grid-template-columns:1fr}
  .topbar-right{width:100%;justify-content:space-between}
}
@media(max-width:480px){.cards{grid-template-columns:1fr}}
</style>
</head>
<body>

<div id="login">
  <div class="login-card">
    <img class="logo" id="loginLogo" src="logocontrole.jpeg" alt="LINDENBERG" onerror="logoLoginFalhou(this)">
    <div id="loginFallback" style="display:none;font-family:Georgia,serif;font-size:26px;color:var(--bordo);margin-bottom:20px">LINDENBERG<small style="display:block;font-family:Inter;font-size:10px;letter-spacing:4px;color:#666">DESDE 1954</small></div>
    <h1>Controle de Acesso</h1>
    <p>Acesse o sistema de portaria</p>
    <div class="field"><label>Usuário</label><input type="text" id="loginEmail" value="Portaria"></div>
    <div class="field"><label>Senha</label><input type="password" id="loginSenha" placeholder="Digite a senha"></div>
    <button class="btn btn-primary" id="btnEntrar" style="width:100%;justify-content:center">Entrar</button>
    <div class="dica">🔑 Usuário: Portaria</div>
  </div>
</div>

<div id="app">
  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <div class="logo-wrap">
        <img src="logocontrole.jpeg" alt="LINDENBERG" onerror="this.style.display='none';document.getElementById('sideFallback').style.display='block'">
        <div id="sideFallback" style="display:none" class="fallback">LINDENBERG<small>DESDE 1954</small></div>
      </div>
      <nav id="menuNav"></nav>
      <div class="logout"><a href="#" onclick="sair()">⏻ Sair</a></div>
    </aside>
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar(false)"></div>
    <main class="main">
      <button class="hamburger" onclick="toggleSidebar()">☰</button>
      <div class="topbar">
        <div id="pageTitle"></div>
        <div class="topbar-right">
          <div class="clock" id="clock"></div>
          <button class="btn btn-primary" id="btnNovoRegistro" onclick="abrirNovoRegistro()">+ Novo Registro</button>
        </div>
      </div>
      <div id="content"></div>
    </main>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay"><div class="modal" id="modalBox"></div></div>
<div class="modal-overlay" id="confirmOverlay"><div class="modal" style="width:400px" id="confirmBox"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ============ ARMAZENAMENTO SEGURO ============ */
let _memStore = {};
function storageGet(key){ try{ return localStorage.getItem(key); }catch(e){ return _memStore[key]!==undefined?_memStore[key]:null; } }
function storageSet(key,val){ try{ localStorage.setItem(key,val); return true; }catch(e){ _memStore[key]=val; return false; } }
function storageRemove(key){ try{ localStorage.removeItem(key); }catch(e){} delete _memStore[key]; }

/* ============ BANCO DE DADOS ============ */
const DB_KEY='lindenberg_v1', SES_KEY='lindenberg_sessao';
let DB=null, sessao=null, estado={pagina:'inicio', filtroVeic:'todos', filtroVisit:'todos', pagVeic:1, pagVisit:1, pagToalha:1, mesAtual:'2026-09', abaToalha:'diario', diaToalha:null, abaHistorico:'veiculos', abaPerfil:'historico'};
/* ===== SUPABASE — BANCO ONLINE (sincroniza entre aparelhos) ===== */
var SUPABASE_URL='https://lhlzqeazgljnpxedphkr.supabase.co';
var SUPABASE_ANON='sb_publishable_t9gtVUH5C-VjUftoWWns5Q_42GQAyhB';
var SUPABASE_TABELA='app_data';
var SUPABASE_LINHA='principal';

function supabaseRest(caminho, opcoes){
  const base = {
    headers: {
      'apikey': SUPABASE_ANON,
      'Authorization': 'Bearer ' + SUPABASE_ANON,
      'Content-Type': 'application/json'
    }
  };
  const extras = opcoes || {};
  const headers = Object.assign({}, base.headers, extras.headers || {});
  return fetch(SUPABASE_URL + '/rest/v1/' + caminho, Object.assign({}, base, extras, { headers: headers }));
}
function novoDB(){
  return {versao:1,usuarios:[],veiculos:[],visitantes:[],movimentacoes:[],toalhas:[],config:{estoqueInicial:{},observacoes:{},empresa:{nome:'LINDENBERG Engenharia',endereco:''}}};
}

function normalizarDB(d){
  const base=novoDB();
  Object.keys(base).forEach(k=>{ if(d[k]===undefined)d[k]=base[k]; });
  ['usuarios','veiculos','visitantes','movimentacoes','toalhas'].forEach(k=>{ if(!Array.isArray(d[k]))d[k]=[]; });
  if(!d.config||typeof d.config!=='object')d.config={};
  if(!d.config.estoqueInicial||typeof d.config.estoqueInicial!=='object')d.config.estoqueInicial={};
  if(!d.config.observacoes||typeof d.config.observacoes!=='object')d.config.observacoes={};
  if(!d.config.empresa||typeof d.config.empresa!=='object')d.config.empresa={};
  else d.config.empresa={...base.config.empresa,...d.config.empresa};
  if(d.versao===undefined)d.versao=1;
  return d;
}

function salvarDB(){
  DB.atualizadoEm=new Date().toISOString();
  storageSet(DB_KEY, JSON.stringify(DB));
  supabaseRest(SUPABASE_TABELA, {
    method:'POST',
    body:JSON.stringify({id:SUPABASE_LINHA, data:DB}),
    headers:{'Prefer':'resolution=merge-duplicates'}
  }).then(r=>{
    if(!r.ok){ console.warn('Supabase: erro ao salvar (código '+r.status+')'); }
    else { console.log('Supabase: salvo na nuvem com sucesso'); }
  }).catch(()=>console.warn('Supabase: offline — salvo apenas neste aparelho.'));
}

function carregarDB(){
  const raw=storageGet(DB_KEY);
  let tinhaLocal=false;
  if(raw){
    try{ DB=normalizarDB(JSON.parse(raw)); tinhaLocal=true; }
    catch(e){ try{ storageSet('lindenberg_corrompido_'+Date.now(), raw); }catch(_){} }
  }
  if(!DB||typeof DB!=='object'){ DB=novoDB(); semear(); }
  if(tinhaLocal) storageSet(DB_KEY, JSON.stringify(DB));
  carregarRemoto(tinhaLocal);
}

function carregarRemoto(tinhaLocal){
  supabaseRest(SUPABASE_TABELA+'?select=data&id=eq.'+SUPABASE_LINHA)
    .then(r=>{ if(!r.ok) throw new Error('http '+r.status); return r.json(); })
    .then(linhas=>{
      const remoto=(linhas&&linhas[0]&&linhas[0].data)||null;
      const remotoOk=remoto&&typeof remoto==='object';
      if(remotoOk){
        const remotoT=new Date(remoto.atualizadoEm||0).getTime()||0;
        const localT=DB.atualizadoEm?new Date(DB.atualizadoEm).getTime():0;
        const antes=JSON.stringify(DB);
        if(!tinhaLocal || remotoT>localT){ DB=normalizarDB(remoto); storageSet(DB_KEY, JSON.stringify(DB)); console.log('Supabase: dados sincronizados da nuvem'); }
        else if(localT>remotoT){ salvarDB(); }
        if(antes!==JSON.stringify(DB)){
          if(typeof renderMenu==='function') renderMenu();
          if(typeof renderPagina==='function') renderPagina();
        }
      } else if(tinhaLocal){ salvarDB(); }
    })
    .catch(()=>{ /* offline: segue com os dados locais */ });
}

/* ===== SYNC AUTOMÁTICO — busca mudanças da nuvem a cada 15s ===== */
setInterval(function(){
  if(typeof carregarRemoto==='function') carregarRemoto(true);
}, 15000);
/* ============ HELPERS ============ */
function getUsuario(){ return DB.usuarios.find(u=>u.id===sessao)||DB.usuarios[0]; }
function iniciais(nome){ const p=nome.trim().split(/\s+/); return (p[0][0]+(p[1]?p[1][0]:'')).toUpperCase(); }
function avatarHtml(pessoa,size){ const s=size||36; const f=pessoa.foto; return `<div class="avatar" style="width:${s}px;height:${s}px;font-size:${Math.round(s*0.4)}px">${f?`<img src="${f}">`:iniciais(pessoa.nome||pessoa.motorista)}</div>`; }
function pillMov(m){ return m==='entrada'?`<span class="pill pill-green">● Entrada</span>`:`<span class="pill pill-red">● Saída</span>`; }
function pillStatus(dentro){ return dentro?`<span class="pill pill-green">● Dentro do local</span>`:`<span class="pill pill-red">● Saída</span>`; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(msg,tipo){ const t=document.getElementById('toast'); t.textContent=msg; t.className='toast show '+(tipo||''); setTimeout(()=>t.className='toast',2500); }
function movsDe(refId,tipo){ return DB.movimentacoes.filter(m=>m.refId===refId&&m.tipo===tipo).sort((a,b)=>(b.data+b.horario).localeCompare(a.data+a.horario)); }
function estaDentro(refId,tipo){ const ms=movsDe(refId,tipo); return ms.length>0&&ms[0].movimento==='entrada'&&!ms[0].dataSaida; }
function ultimaMov(refId,tipo){ return movsDe(refId,tipo)[0]||null; }
function ultimaEntrada(refId,tipo){
  const ms=DB.movimentacoes.filter(m=>m.refId===refId&&m.tipo===tipo&&m.movimento==='entrada')
    .sort((a,b)=>(b.data+b.horario).localeCompare(a.data+a.horario));
  return ms[0]||null;
}
// célula: <td>${en?fmtDataHora(en.data,en.horario):'—'}</td>
function ultimaSaida(refId,tipo){
  const ms=DB.movimentacoes.filter(m=>m.refId===refId&&m.tipo===tipo&&m.dataSaida)
    .sort((a,b)=>(b.dataSaida+b.horarioSaida).localeCompare(a.dataSaida+a.horarioSaida));
  return ms[0]||null;
}
function tempoDecorrido(data,horario){ const d=new Date(data+'T'+horario+':00'); const diff=Date.now()-d.getTime(); if(diff<0)return 'agora'; const min=Math.floor(diff/60000); if(min<60)return min+'min'; const h=Math.floor(min/60); return h+'h'+String(min%60).padStart(2,'0'); }

function renderMenu(){ document.getElementById('menuNav').innerHTML=menuItens.map(([id,ic,label])=>`<a href="#" class="${estado.pagina===id?'active':''}" onclick="navegar('${id}')">${ic} ${label}</a>`).join(''); }
function navegar(pag){ estado.pagina=pag; if(pag!=='perfil')estado.perfilRef=null; renderMenu(); renderPagina(); const sb=document.getElementById('sidebar'); if(sb&&sb.classList.contains('open'))toggleSidebar(false); }
function renderPagina(){ const p=paginas[estado.pagina]; document.getElementById('pageTitle').innerHTML=`<h2>${p.titulo}</h2><div class="sub">${p.sub}</div>`; document.getElementById('btnNovoRegistro').style.display=p.novo?'inline-flex':'none'; document.getElementById('btnNovoRegistro').innerHTML='+ Novo Registro'; p.render(); }

/* ============ INÍCIO ============ */
function renderInicio(){
  const hojeKey=hoje();
  const movHoje=DB.movimentacoes.filter(m=>m.data===hojeKey);
  const veicHoje=movHoje.filter(m=>m.tipo==='veiculo').length;
  const visitHoje=movHoje.filter(m=>m.tipo==='visitante').length;
  const noLocal=DB.movimentacoes.filter(m=>m.movimento==='entrada'&&!m.dataSaida).length;
  const emObra=movHoje.filter(m=>m.movimento==='entrada').length;
  const ultimas=DB.movimentacoes.slice().sort((a,b)=>(b.data+b.horario).localeCompare(a.data+a.horario)).slice(0,5);
  const noLocalList=DB.movimentacoes.filter(m=>m.movimento==='entrada'&&!m.dataSaida).sort((a,b)=>a.horario.localeCompare(b.horario));
  const c=document.getElementById('content');
  c.innerHTML=`
  <div class="cards">
    ${card('🚗','Veículos hoje',veicHoje)}${card('👤','Visitantes hoje',visitHoje)}${card('📍','No local',noLocal)}${card('🏗️','Em obra',emObra)}
  </div>
  <div class="panel"><h3>🕐 Últimas movimentações</h3><div class="table-wrap"><table>
    <thead><tr><th>Horário</th><th>Tipo</th><th>Nome / Placa</th><th>Movimentação</th></tr></thead>
    <tbody>${ultimas.map(m=>{const ref=m.tipo==='veiculo'?DB.veiculos.find(v=>v.id===m.refId):DB.visitantes.find(v=>v.id===m.refId);const nome=m.tipo==='veiculo'?ref.placa:ref.nome;return `<tr class="clickable" onclick="abrirPerfil('${m.tipo}','${m.refId}')"><td>${m.horario}</td><td>${m.tipo==='veiculo'?'🚗 Veículo':'👤 Visitante'}</td><td>${esc(nome)}</td><td>${pillMov(m.movimento)}</td></tr>`;}).join('')||'<tr><td colspan="4" style="text-align:center;color:var(--texto2)">Nenhuma movimentação</td></tr>'}</tbody>
  </table></div></div>
  <div class="panel"><h3>📍 Pessoas e veículos no local</h3><div class="table-wrap"><table>
    <thead><tr><th>Tipo</th><th>Nome / Placa</th><th>Entrada</th><th>Tempo</th></tr></thead>
    <tbody>${noLocalList.map(m=>{const ref=m.tipo==='veiculo'?DB.veiculos.find(v=>v.id===m.refId):DB.visitantes.find(v=>v.id===m.refId);const nome=m.tipo==='veiculo'?ref.placa:ref.nome;return `<tr class="clickable" onclick="abrirPerfil('${m.tipo}','${m.refId}')"><td>${m.tipo==='veiculo'?'🚗':'👤'}</td><td>${esc(nome)}</td><td>${m.horario}</td><td class="tempo" data-d="${m.data}" data-h="${m.horario}">${tempoDecorrido(m.data,m.horario)}</td></tr>`;}).join('')||'<tr><td colspan="4" style="text-align:center;color:var(--texto2)">Ninguém no local no momento</td></tr>'}</tbody>
  </table></div></div>`;
}
function card(ic,label,val){ return `<div class="card"><div class="card-icon">${ic}</div><div class="card-label">${label}</div><div class="card-value">${val}</div></div>`; }

/* ============ VEÍCULOS ============ */
function renderVeiculos(){
  let lista=DB.veiculos.slice();
  const q=estado.buscaVeic||'';
  if(q)lista=lista.filter(v=>v.placa.includes(q)||v.motorista.toLowerCase().includes(q.toLowerCase())||v.empresa.toLowerCase().includes(q.toLowerCase()));
  const hojeKey=hoje();
  if(estado.filtroVeic==='nolocal')lista=lista.filter(v=>estaDentro(v.id,'veiculo'));
  if(estado.filtroVeic==='entradas')lista=lista.filter(v=>DB.movimentacoes.some(m=>m.refId===v.id&&m.tipo==='veiculo'&&m.data===hojeKey&&m.movimento==='entrada'));
  if(estado.filtroVeic==='saidas')lista=lista.filter(v=>DB.movimentacoes.some(m=>m.refId===v.id&&m.tipo==='veiculo'&&m.data===hojeKey&&m.movimento==='saida'));
  lista.sort((a,b)=>{ const ma=ultimaMov(a.id,'veiculo'); const mb=ultimaMov(b.id,'veiculo'); const ka=ma?(ma.data+ma.horario):''; const kb=mb?(mb.data+mb.horario):''; if(ka&&kb)return kb.localeCompare(ka); if(ka)return -1; if(kb)return 1; return 0; });
  const porPag=8, total=lista.length, paginasN=Math.max(1,Math.ceil(total/porPag)); if(estado.pagVeic>paginasN)estado.pagVeic=paginasN;
  const ini=(estado.pagVeic-1)*porPag, pagina=lista.slice(ini,ini+porPag);
  const c=document.getElementById('content');
  c.innerHTML=`
  <div class="panel">
    <div class="panel-tools">
      <div class="search-box"><span class="icon">🔍</span><input placeholder="Buscar por placa, motorista ou empresa..." value="${esc(q)}" oninput="estado.buscaVeic=this.value;estado.pagVeic=1;renderVeiculos()"></div>
      <div class="chips">${[['todos','Todos'],['nolocal','No local'],['entradas','Entradas hoje'],['saidas','Saídas hoje']].map(([k,l])=>`<button class="chip ${estado.filtroVeic===k?'active':''}" onclick="estado.filtroVeic='${k}';estado.pagVeic=1;renderVeiculos()">${l}</button>`).join('')}</div>
    </div>
    <div id="buscaAutoVeic"></div>
    <div class="table-wrap"><table>
      <thead><tr><th>Placa</th><th>Motorista</th><th>Empresa</th><th>Entrada</th><th>Saída</th><th>Status</th><th>Ações</th></tr></thead>
      <tbody>${pagina.map(v=>{const en=ultimaEntrada(v.id,'veiculo');const sa=ultimaSaida(v.id,'veiculo');const dentro=estaDentro(v.id,'veiculo');return `<tr class="clickable" onclick="abrirPerfil('veiculo','${v.id}')"><td><b>${esc(v.placa)}</b></td><td>${esc(v.motorista)}</td><td>${esc(v.empresa)}</td><td>${en?fmtDataHora(en.data,en.horario):'—'}</td><td>${sa?fmtDataHora(sa.dataSaida,sa.horarioSaida):'—'}</td><td>${pillStatus(dentro)}</td><td onclick="event.stopPropagation()">${menuAcoes('veiculo',v.id)}</td></tr>`;}).join('')||'<tr><td colspan="7" style="text-align:center;color:var(--texto2)">Nenhum veículo encontrado</td></tr>'}</tbody>    </table></div>
    ${paginationHtml(estado.pagVeic,paginasN,total,'pagVeic')}
  </div>`;
  const placaExata=DB.veiculos.find(v=>v.placa===q.toUpperCase());
  if(placaExata&&q.length>=7)document.getElementById('buscaAutoVeic').innerHTML=painelEncontrado('veiculo',placaExata);
}
function painelEncontrado(tipo,ref){
  const ms=movsDe(ref.id,tipo), dentro=estaDentro(ref.id,tipo), um=ms[0];
  const nome=tipo==='veiculo'?ref.placa:ref.nome;
  const sub=tipo==='veiculo'?`Motorista: ${ref.motorista}`:`Documento: ${ref.documento}`;
  return `<div class="panel" style="border:2px solid var(--bordo)">
    <div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:16px">
      ${avatarHtml(ref,56)}
      <div style="flex:1;min-width:200px"><h3 style="margin:0">${tipo==='veiculo'?'🚗':''} ${esc(nome)}</h3><p style="color:var(--texto2);font-size:13px">${esc(sub)}<br>Empresa: ${esc(ref.empresa)}</p>
        <div style="display:flex;gap:16px;margin-top:8px;flex-wrap:wrap"><span style="font-size:13px;color:var(--texto2)">Total de visitas: <b>${ms.length}</b></span><span style="font-size:13px;color:var(--texto2)">Última movimentação: <b>${um?fmtDataHora(um.data,um.horario):'—'}</b></span><span>${pillStatus(dentro)}</span></div>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">${dentro?`<button class="btn btn-primary" onclick="event.stopPropagation();registrarSaida('${tipo}','${ref.id}')">Registrar Saída</button>`:`<button class="btn btn-primary" onclick="event.stopPropagation();abrirRegistroEntrada('${tipo}','${ref.id}')">Registrar Entrada</button>`}<button class="btn btn-outline" onclick="event.stopPropagation();abrirPerfil('${tipo}','${ref.id}')">Ver histórico completo →</button></div>
    </div>
    <h4 style="font-size:14px;color:var(--texto);margin-bottom:10px">Últimas visitas</h4>
    <div class="table-wrap"><table><thead><tr><th>Data</th><th>Horário</th><th>Movimento</th></tr></thead><tbody>${ms.slice(0,5).map(m=>`<tr><td>${fmtData(m.data)}</td><td>${m.horario}</td><td>${pillMov(m.movimento)}</td></tr>`).join('')}</tbody></table></div>
  </div>`;
}

  if(q)lista=lista.filter(v=>v.nome.toLowerCase().includes(q.toLowerCase())||numeroDoc(v.documento).includes(numeroDoc(q))||v.empresa.toLowerCase().includes(q.toLowerCase()));
  const hojeKey=hoje();
  if(estado.filtroVisit==='dentro')lista=lista.filter(v=>estaDentro(v.id,'visitante'));
  if(estado.filtroVisit==='entradas')lista=lista.filter(v=>DB.movimentacoes.some(m=>m.refId===v.id&&m.tipo==='visitante'&&m.data===hojeKey&&m.movimento==='entrada'));
  if(estado.filtroVisit==='saidas')lista=lista.filter(v=>DB.movimentacoes.some(m=>m.refId===v.id&&m.tipo==='visitante'&&m.data===hojeKey&&m.movimento==='saida'));
  lista.sort((a,b)=>{ const ma=ultimaMov(a.id,'visitante'); const mb=ultimaMov(b.id,'visitante'); const ka=ma?(ma.data+ma.horario):''; const kb=mb?(mb.data+mb.horario):''; if(ka&&kb)return kb.localeCompare(ka); if(ka)return -1; if(kb)return 1; return 0; });
  const porPag=8, total=lista.length, paginasN=Math.max(1,Math.ceil(total/porPag)); if(estado.pagVisit>paginasN)estado.pagVisit=paginasN;
  const ini=(estado.pagVisit-1)*porPag, pagina=lista.slice(ini,ini+porPag);
  const c=document.getElementById('content');
  c.innerHTML=`
  <div class="panel">
    <div class="panel-tools">
      <div class="search-box"><span class="icon">🔍</span><input placeholder="Buscar por nome ou documento..." value="${esc(q)}" oninput="estado.buscaVisit=this.value;estado.pagVisit=1;renderVisitantes()"></div>
      <div class="chips">${[['todos','Todos'],['dentro','Dentro'],['entradas','Entradas hoje'],['saidas','Saídas hoje']].map(([k,l])=>`<button class="chip ${estado.filtroVisit===k?'active':''}" onclick="estado.filtroVisit='${k}';estado.pagVisit=1;renderVisitantes()">${l}</button>`).join('')}</div>
    </div>
    <div id="buscaAutoVisit"></div>
    <div class="table-wrap"><table>
      <thead><tr><th>Foto</th><th>Nome</th><th>Documento</th><th>Empresa</th><th>Entrada</th><th>Saída</th><th>Status</th><th>Ações</th></tr></thead>
      <tbody>${pagina.map(v=>{const en=ultimaEntrada(v.id,'visitante');const sa=ultimaSaida(v.id,'visitante');const dentro=estaDentro(v.id,'visitante');return `<tr class="clickable" onclick="abrirPerfil('visitante','${v.id}')"><td>${avatarHtml(v)}</td><td><b>${esc(v.nome)}</b></td><td>${esc(v.documento)}</td><td>${esc(v.empresa)}</td><td>${en?fmtDataHora(en.data,en.horario):'—'}</td><td>${sa?fmtDataHora(sa.dataSaida,sa.horarioSaida):'—'}</td><td>${pillStatus(dentro)}</td><td onclick="event.stopPropagation()">${menuAcoes('visitante',v.id)}</td></tr>`;}).join('')||'<tr><td colspan="8" style="text-align:center;color:var(--texto2)">Nenhum visitante encontrado</td></tr>'}</tbody>    </table></div>
    ${paginationHtml(estado.pagVisit,paginasN,total,'pagVisit')}
  </div>`;
  const docExato=DB.visitantes.find(v=>numeroDoc(v.documento)===numeroDoc(q));
  if(docExato&&numeroDoc(q).length>=6)document.getElementById('buscaAutoVisit').innerHTML=painelEncontrado('visitante',docExato);
}

/* ============ HISTÓRICO ============ */
function renderHistorico(){
  const c=document.getElementById('content');
  c.innerHTML=`
  <div class="panel">
    <div class="tabs">
      <button class="${estado.abaHistorico==='veiculos'?'active':''}" onclick="estado.abaHistorico='veiculos';estado.buscaHist='';renderHistorico()">Veículos</button>
      <button class="${estado.abaHistorico==='visitantes'?'active':''}" onclick="estado.abaHistorico='visitantes';estado.buscaHist='';renderHistorico()">Visitantes</button>
    </div>
    <div class="panel-tools"><div class="search-box"><span class="icon">🔍</span><input placeholder="${estado.abaHistorico==='veiculos'?'Buscar por placa, motorista ou empresa...':'Buscar por nome, documento ou empresa...'}" value="${esc(estado.buscaHist||'')}" oninput="estado.buscaHist=this.value;renderHistorico()"></div></div>
    <div id="histResult"></div>
  </div>`;
  const q=(estado.buscaHist||'').toLowerCase();
  if(!q){ document.getElementById('histResult').innerHTML='<p style="color:var(--texto2);text-align:center;padding:20px">Digite algo para pesquisar o histórico.</p>'; return; }
  let refs;
  if(estado.abaHistorico==='veiculos')refs=DB.veiculos.filter(v=>v.placa.toLowerCase().includes(q)||v.motorista.toLowerCase().includes(q)||v.empresa.toLowerCase().includes(q));
  else refs=DB.visitantes.filter(v=>v.nome.toLowerCase().includes(q)||numeroDoc(v.documento).includes(numeroDoc(estado.buscaHist))||v.empresa.toLowerCase().includes(q));
  if(!refs.length){ document.getElementById('histResult').innerHTML='<p style="color:var(--texto2);text-align:center;padding:20px">Nenhum resultado encontrado.</p>'; return; }
  document.getElementById('histResult').innerHTML=refs.map(ref=>{
    const tipo=estado.abaHistorico==='veiculos'?'veiculo':'visitante';
    const ms=movsDe(ref.id,tipo), dentro=estaDentro(ref.id,tipo);
    const titulo=tipo==='veiculo'?ref.placa:ref.nome;
    const sub=tipo==='veiculo'?`Motorista: ${ref.motorista}`:`Documento: ${ref.documento}`;
    return `<div class="panel" style="margin-bottom:16px">
      <div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:12px">
        ${avatarHtml(ref,48)}
        <div style="flex:1"><h3 style="margin:0">${esc(titulo)}</h3><p style="color:var(--texto2);font-size:13px">${esc(sub)}<br>Empresa: ${esc(ref.empresa)}</p></div>
        <div style="display:flex;gap:16px;flex-wrap:wrap;align-items:center"><span style="font-size:13px;color:var(--texto2)">Total de visitas: <b>${ms.length}</b></span>${pillStatus(dentro)}<button class="btn btn-outline btn-sm" onclick="abrirPerfil('${tipo}','${ref.id}')">Ver perfil completo</button></div>
      </div>
      <div class="table-wrap"><table><thead><tr><th>Data</th><th>Horário</th><th>Tipo</th><th>Observação</th><th>Usuário</th></tr></thead><tbody>${ms.map(m=>`<tr><td>${fmtData(m.data)}</td><td>${m.horario}</td><td>${pillMov(m.movimento)}</td><td>${esc(m.observacao||'—')}</td><td>${esc(m.movimento==='saida'?(m.usuarioSaida||m.usuario):m.usuario)}</td></tr>`).join('')}</tbody></table></div>
    </div>`;
  }).join('');
}

/* ============ PERFIL ============ */
function abrirPerfil(tipo,id){ estado.pagina='perfil'; estado.perfilRef={tipo,id}; estado.abaPerfil='historico'; renderMenu(); renderPagina(); }
function renderPerfil(){
  const {tipo,id}=estado.perfilRef;
  const ref=tipo==='veiculo'?DB.veiculos.find(v=>v.id===id):DB.visitantes.find(v=>v.id===id);
  if(!ref){ navegar('inicio'); return; }
  const ms=movsDe(id,tipo), dentro=estaDentro(id,tipo), um=ms[0];
  const nome=tipo==='veiculo'?ref.placa:ref.nome;
  const p=paginas.perfil; p.sub=tipo==='veiculo'?`Veículo ${ref.placa}`:`Visitante ${ref.nome}`;
  document.getElementById('pageTitle').innerHTML=`<h2>${p.titulo}</h2><div class="sub">${p.sub}</div>`;
  document.getElementById('btnNovoRegistro').style.display='none';
  const c=document.getElementById('content');
  c.innerHTML=`
  <button class="btn btn-ghost" onclick="navegar('${tipo==='veiculo'?'veiculos':'visitantes'}')" style="margin-bottom:16px">← Voltar</button>
  <div class="panel">
    <div class="profile-head">
      ${avatarHtml(ref,80)}
      <div class="profile-info"><h2>${tipo==='veiculo'?'🚗 ':''}${esc(nome)}</h2><p>${tipo==='veiculo'?`Motorista: ${esc(ref.motorista)}`:`Documento: ${esc(ref.documento)}`} • Empresa: ${esc(ref.empresa)}</p>
        <div class="profile-stats"><div class="stat"><b>${ms.length}</b>Total de visitas</div><div class="stat"><b>${um?fmtDataHora(um.data,um.horario):'—'}</b>Última movimentação</div><div class="stat"><b>${dentro?'Dentro':'Fora'}</b>Status atual</div></div>
      </div>
      <div style="margin-left:auto">${dentro?`<button class="btn btn-primary" onclick="event.stopPropagation();registrarSaida('${tipo}','${id}')">Registrar Saída</button>`:`<button class="btn btn-primary" onclick="event.stopPropagation();abrirRegistroEntrada('${tipo}','${id}')">Registrar Entrada</button>`}</div>

function renderToalhaDiario(){
  const mes=estado.mesAtual;
  const regs=DB.toalhas.filter(t=>t.mes===mes);
  const q=(estado.buscaToalha||'').toLowerCase();
  const dias=[...new Set(regs.map(r=>r.data))].sort().reverse();
  if(!estado.diaToalha||!dias.includes(estado.diaToalha)){ const h=hoje(); estado.diaToalha=dias.includes(h)?h:(dias[0]||(mes+'-01')); }
  let diaRegs=regs.filter(r=>r.data===estado.diaToalha);
  if(q)diaRegs=diaRegs.filter(r=>r.nome.toLowerCase().includes(q)||r.empresa.toLowerCase().includes(q)||r.responsavel.toLowerCase().includes(q));
  diaRegs.sort((a,b)=>b.horario.localeCompare(a.horario));
  const entDia=diaRegs.filter(r=>r.entregue).reduce((s,r)=>s+r.quantidade,0);
  const devDia=diaRegs.filter(r=>r.devolvido).reduce((s,r)=>s+r.quantidade,0);
  const pessoasDia=new Set(diaRegs.map(r=>r.nome)).size;
  const ordemDia=diaRegs.slice().sort((a,b)=>a.horario.localeCompare(b.horario));
  const numMap={}; ordemDia.forEach((r,i)=>{ numMap[r.id]=i+1; });
  const porPag=10, total=diaRegs.length, paginasN=Math.max(1,Math.ceil(total/porPag)); if(estado.pagToalha>paginasN)estado.pagToalha=paginasN;
  const ini=(estado.pagToalha-1)*porPag, pagina=diaRegs.slice(ini,ini+porPag);
  const diaOpts=dias.map(d=>`<option value="${d}" ${d===estado.diaToalha?'selected':''}>${fmtData(d)} — ${regs.filter(r=>r.data===d).length} registro(s)</option>`).join('');

    <div class="month-selector"><label style="margin:0">Dia</label><select style="width:auto;min-width:220px" onchange="estado.diaToalha=this.value;estado.pagToalha=1;renderToalhas()">${diaOpts}</select></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><span class="chip-mini green">✓ Entregues no dia: ${entDia}</span><span class="chip-mini red">✕ Devolvidas no dia: ${devDia}</span><span class="chip-mini">👤 Pessoas: ${pessoasDia}</span></div>

    <thead><tr><th>Nº</th><th>Nome</th><th>Empresa</th><th>Entregue</th><th>Devolvido</th><th>Horário</th><th>Responsável</th><th>Ações</th></tr></thead>
    <tbody>${pagina.map(t=>`<tr><td><b>${numMap[t.id]||1}ª</b></td><td><b>${esc(t.nome)}</b></td><td>${esc(t.empresa)}</td><td>${t.entregue?`<span class="pill pill-green">✓ ${t.quantidade}</span>`:'—'}</td><td>${t.devolvido?`<span class="pill pill-red">✕ ${t.quantidade}</span>`:'—'}</td><td>${t.horario}</td><td>${esc(t.responsavel)}</td><td>${menuAcoes('toalha',t.id)}</td></tr>`).join('')||'<tr><td colspan="8" style="text-align:center;color:var(--texto2)">Nenhum registro neste dia</td></tr>'}</tbody>
  </table></div>
  ${paginationHtml(estado.pagToalha,paginasN,total,'pagToalha')}`;
}
function renderToalhaConsolidado(){
  const mes=estado.mesAtual;
  let regs=DB.toalhas.filter(t=>t.mes===mes);
  const q=(estado.buscaToalha||'').toLowerCase();
  if(q)regs=regs.filter(r=>r.nome.toLowerCase().includes(q)||r.empresa.toLowerCase().includes(q)||r.responsavel.toLowerCase().includes(q));
  const porDia={};
  regs.forEach(r=>{ if(!porDia[r.data])porDia[r.data]={ent:0,dev:0}; if(r.entregue)porDia[r.data].ent+=r.quantidade; if(r.devolvido)porDia[r.data].dev+=r.quantidade; });
  const dias=Object.keys(porDia).sort();
  let accE=0,accD=0;
  const linhasDia=dias.map(d=>{ accE+=porDia[d].ent; accD+=porDia[d].dev; return {data:d,ent:porDia[d].ent,dev:porDia[d].dev,accE,accD,saldo:accE-accD}; });
  const porPessoa={};
  regs.forEach(r=>{ const k=r.nome+'|'+r.empresa; if(!porPessoa[k])porPessoa[k]={nome:r.nome,empresa:r.empresa,reg:0,ent:0,dev:0}; porPessoa[k].reg++; if(r.entregue)porPessoa[k].ent+=r.quantidade; if(r.devolvido)porPessoa[k].dev+=r.quantidade; });
  const pessoas=Object.values(porPessoa).sort((a,b)=>(b.ent+b.dev)-(a.ent+a.dev)||a.nome.localeCompare(b.nome));
  const tot=regs.reduce((s,r)=>s+r.quantidade,0);
  const totEnt=regs.filter(r=>r.entregue).reduce((s,r)=>s+r.quantidade,0);
  const totDev=regs.filter(r=>r.devolvido).reduce((s,r)=>s+r.quantidade,0);
  document.getElementById('toalhaView').innerHTML=`
  <div class="subtitulo-secao">📅 Resumo acumulado por dia — ${nomeMes(mes)}</div>
  <div class="table-wrap"><table><thead><tr><th>Data</th><th>Entregues</th><th>Devolvidas</th><th>Saldo do dia</th><th>Acum. entregues</th><th>Acum. devolvidas</th><th>Em circulação (acum.)</th></tr></thead>
    <tbody>${linhasDia.map(l=>`<tr><td><b>${fmtData(l.data)}</b></td><td><span class="pill pill-green">✓ ${l.ent}</span></td><td><span class="pill pill-red">✕ ${l.dev}</span></td><td>${l.ent-l.dev}</td><td>${l.accE}</td><td>${l.accD}</td><td><b>${l.saldo}</b></td></tr>`).join('')||'<tr><td colspan="7" style="text-align:center;color:var(--texto2)">Nenhum registro no mês</td></tr>'}${linhasDia.length?`<tr class="totais-row"><td>Total do mês</td><td>✓ ${totEnt}</td><td>✕ ${totDev}</td><td>${totEnt-totDev}</td><td>${totEnt}</td><td>${totDev}</td><td>${totEnt-totDev}</td></tr>`:''}</tbody></table></div>
  <div class="subtitulo-secao">👥 Consolidado por pessoa — ${nomeMes(mes)}</div>
  <div class="table-wrap"><table><thead><tr><th>Nº</th><th>Nome</th><th>Empresa</th><th>Registros</th><th>Entregues</th><th>Devolvidas</th><th>Em circulação</th></tr></thead>
    <tbody>${pessoas.map((p,i)=>`<tr><td><b>${i+1}ª</b></td><td><b>${esc(p.nome)}</b></td><td>${esc(p.empresa)}</td><td>${p.reg}</td><td><span class="pill pill-green">✓ ${p.ent}</span></td><td><span class="pill pill-red">✕ ${p.dev}</span></td><td><b>${p.ent-p.dev}</b></td></tr>`).join('')||'<tr><td colspan="7" style="text-align:center;color:var(--texto2)">Nenhum registro no mês</td></tr>'}${pessoas.length?`<tr class="totais-row"><td colspan="2">Total do mês</td><td>${pessoas.length} pessoa(s)</td><td>${regs.length}</td><td>${totEnt}</td><td>${totDev}</td><td>${totEnt-totDev}</td></tr>`:''}</tbody></table></div>
  <p style="color:var(--texto2);font-size:12px;margin-top:10px">Total de toalhas movimentadas no mês: <b>${tot}</b> (${regs.length} registro(s))</p>`;
}

function renderRelatorios(){
  const c=document.getElementById('content');
  c.innerHTML=`<div class="panel">
    <div class="filters">
      <div class="field"><label>Data inicial</label><input type="date" id="relIni" value="2026-09-01"></div>
      <div class="field"><label>Data final</label><input type="date" id="relFim" value="2026-09-08"></div>
      <div class="field"><label>Tipo</label><select id="relTipo"><option value="todos">Todos</option><option value="veiculos">Veículos</option><option value="visitantes">Visitantes</option><option value="toalhas">Toalhas</option></select></div>
      <div class="field"><label>Movimentação</label><select id="relMov"><option value="todos">Todos</option><option value="entradas">Entradas</option><option value="saidas">Saídas</option><option value="entregas">Entregas</option><option value="devolucoes">Devoluções</option></select></div>
    </div>
    <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn btn-primary" onclick="gerarRelatorio()">Gerar relatório</button><button class="btn btn-outline" onclick="exportarExcel()">📥 Exportar Excel</button></div>
    <div id="relResult" style="margin-top:20px"></div>
  </div>`;
}
function dadosRelatorio(){
  const ini=document.getElementById('relIni').value||'2026-01-01', fim=document.getElementById('relFim').value||'2026-12-31';
  const tipo=document.getElementById('relTipo').value, mov=document.getElementById('relMov').value;
  let linhas=[];
  if(tipo==='todos'||tipo==='veiculos'||tipo==='visitantes'){
    let ms=DB.movimentacoes.filter(m=>m.data>=ini&&m.data<=fim);
    if(tipo==='veiculos')ms=ms.filter(m=>m.tipo==='veiculo');
    if(tipo==='visitantes')ms=ms.filter(m=>m.tipo==='visitante');
    if(mov==='entradas')ms=ms.filter(m=>m.movimento==='entrada');
    if(mov==='saidas')ms=ms.filter(m=>m.movimento==='saida');
    linhas=ms.sort((a,b)=>(b.data+b.horario).localeCompare(a.data+a.horario)).map(m=>{ const ref=m.tipo==='veiculo'?DB.veiculos.find(v=>v.id===m.refId):DB.visitantes.find(v=>v.id===m.refId); return {data:m.data,horario:m.horario,tipo:m.tipo==='veiculo'?'Veículo':'Visitante',nome:m.tipo==='veiculo'?ref.placa:ref.nome,empresa:ref.empresa,mov:m.movimento,obs:m.observacao||'',usuario:m.movimento==='saida'?(m.usuarioSaida||m.usuario):m.usuario}; });
  }else{
    let ts=DB.toalhas.filter(t=>t.data>=ini&&t.data<=fim);
    if(mov==='entregas')ts=ts.filter(t=>t.entregue);
    if(mov==='devolucoes')ts=ts.filter(t=>t.devolvido);
    linhas=ts.sort((a,b)=>(b.data+b.horario).localeCompare(a.data+a.horario)).map(t=>({data:t.data,horario:t.horario,tipo:'Toalha',nome:t.nome,empresa:t.empresa,mov:t.entregue?'entrega':'devolucao',obs:t.observacao||'',usuario:t.usuario}));
  }
  return linhas;
}
function gerarRelatorio(){
  const linhas=dadosRelatorio();
  document.getElementById('relResult').innerHTML=`<h3 style="font-size:15px;color:var(--texto);margin-bottom:12px">Resultado: ${linhas.length} registro(s)</h3><div class="table-wrap"><table><thead><tr><th>Data</th><th>Horário</th><th>Tipo</th><th>Nome / Placa</th><th>Empresa</th><th>Movimentação</th><th>Observação</th><th>Usuário</th></tr></thead><tbody>${linhas.map(l=>`<tr><td>${fmtData(l.data)}</td><td>${l.horario}</td><td>${l.tipo}</td><td>${esc(l.nome)}</td><td>${esc(l.empresa)}</td><td>${l.mov==='entrada'||l.mov==='entrega'?`<span class="pill pill-green">${l.mov==='entrada'?'Entrada':'Entrega'}</span>`:`<span class="pill pill-red">${l.mov==='saida'?'Saída':'Devolução'}</span>`}</td><td>${esc(l.obs||'—')}</td><td>${esc(l.usuario)}</td></tr>`).join('')||'<tr><td colspan="8" style="text-align:center;color:var(--texto2)">Nenhum registro no período</td></tr>'}</tbody></table></div>`;
}
function exportarExcel(){
  const linhas=dadosRelatorio();
  let csv='\ufeffData;Horário;Tipo;Nome/Placa;Empresa;Movimentação;Observação;Usuário\n';
  linhas.forEach(l=>{ const mov=l.mov==='entrada'||l.mov==='entrega'?(l.mov==='entrada'?'Entrada':'Entrega'):(l.mov==='saida'?'Saída':'Devolução'); csv+=[fmtData(l.data),l.horario,l.tipo,l.nome,l.empresa,mov,l.obs,l.usuario].map(v=>`"${String(v).replace(/"/g,'""')}"`).join(';')+'\n'; });
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='relatorio_lindenberg_'+hoje()+'.csv'; a.click(); toast('Relatório exportado','success');
}

/* ===== BACKUP ===== */
function exportarBackup(){
  const d=new Date(),p=n=>String(n).padStart(2,'0');
  const nome='backup_toalhas_'+d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'_'+p(d.getHours())+'-'+p(d.getMinutes())+'.json';
  const pacote={app:'lindenberg',tipo:'backup',versao:1,criadoEm:new Date().toISOString(),
    dados:JSON.parse(JSON.stringify(DB))};  /* cópia fiel de TUDO: estoques, pessoas, placas, histórico, config */
  const blob=new Blob([JSON.stringify(pacote,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download=nome;
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);
  toast('Backup exportado: '+nome,'success');
}
/* ============ AÇÕES / MENU ⋯ ============ */
function menuAcoes(tipo,id){
  return `<div class="dropdown"><button class="actions-btn" onclick="event.stopPropagation();toggleMenu(this)">⋯</button><div class="dropdown-menu"><button onclick="event.stopPropagation();abrirPerfil('${tipo}','${id}')">👁 Visualizar</button><button onclick="event.stopPropagation();editarRegistro('${tipo}','${id}')">✏️ Editar</button><button onclick="event.stopPropagation();confirmarExcluir('${tipo}','${id}')">🗑 Excluir</button></div></div>`;
}
function toggleMenu(btn){ const m=btn.nextElementSibling, aberto=m.classList.contains('open'); document.querySelectorAll('.dropdown-menu.open').forEach(x=>x.classList.remove('open')); if(!aberto)m.classList.add('open'); }
document.addEventListener('click',()=>document.querySelectorAll('.dropdown-menu.open').forEach(x=>x.classList.remove('open')));
function confirmarExcluir(tipo,id){
  let nome='';
  if(tipo==='veiculo')nome=DB.veiculos.find(v=>v.id===id).placa;
  else if(tipo==='visitante')nome=DB.visitantes.find(v=>v.id===id).nome;
  else if(tipo==='toalha'){ const t=DB.toalhas.find(t=>t.id===id); nome=t.nome+' ('+fmtData(t.data)+')'; }
  document.getElementById('confirmBox').innerHTML=`<h3>Excluir registro</h3><p style="color:var(--texto2);margin-bottom:20px">Tem certeza que deseja excluir <b>${esc(nome)}</b>? Esta ação não pode ser desfeita.</p><div class="modal-actions"><button class="btn btn-ghost" onclick="fecharConfirm()">Cancelar</button><button class="btn btn-primary" style="background:var(--vermelho-tx)" onclick="excluirRegistro('${tipo}','${id}')">Excluir</button></div>`;
  document.getElementById('confirmOverlay').classList.add('open');
}
function excluirRegistro(tipo,id){
  if(tipo==='veiculo'){ DB.veiculos=DB.veiculos.filter(v=>v.id!==id); DB.movimentacoes=DB.movimentacoes.filter(m=>!(m.refId===id&&m.tipo==='veiculo')); }
  else if(tipo==='visitante'){ DB.visitantes=DB.visitantes.filter(v=>v.id!==id); DB.movimentacoes=DB.movimentacoes.filter(m=>!(m.refId===id&&m.tipo==='visitante')); }
  else if(tipo==='toalha')DB.toalhas=DB.toalhas.filter(t=>t.id!==id);
  salvarDB(); fecharConfirm(); renderPagina(); toast('Registro excluído','success');
}
function editarRegistro(tipo,id){
  if(tipo==='veiculo'){ const v=DB.veiculos.find(v=>v.id===id); abrirModal(`<h3>Editar Veículo — ${esc(v.placa)}</h3><div class="field"><label>Motorista</label><input id="eMotorista" value="${esc(v.motorista)}"></div><div class="field"><label>Empresa</label><input id="eEmpresa" value="${esc(v.empresa)}"></div><div class="field"><label>Observação / Motivo</label><input id="eObs" value="${esc(v.observacao)}"></div><div class="modal-actions"><button class="btn btn-ghost" onclick="fecharModal()">Cancelar</button><button class="btn btn-primary" onclick="salvarEdicaoVeiculo('${id}')">Salvar</button></div>`); }
  else if(tipo==='visitante'){ const v=DB.visitantes.find(v=>v.id===id); abrirModal(`<h3>Editar Visitante — ${esc(v.nome)}</h3><div class="field"><label>Nome</label><input id="eNome" value="${esc(v.nome)}"></div><div class="field"><label>Empresa</label><input id="eEmpresa" value="${esc(v.empresa)}"></div><div class="field"><label>Observação / Motivo</label><input id="eObs" value="${esc(v.observacao)}"></div><div class="modal-actions"><button class="btn btn-ghost" onclick="fecharModal()">Cancelar</button><button class="btn btn-primary" onclick="salvarEdicaoVisitante('${id}')">Salvar</button></div>`); }
else if(tipo==='toalha'){ const t=DB.toalhas.find(t=>t.id===id); abrirModal(`<h3>Editar Registro de Toalha</h3><div class="field"><label>Nome</label><input id="tNome" value="${esc(t.nome)}"></div><div class="field"><label>Empresa</label><input id="tEmpresa" value="${esc(t.empresa)}"></div><div class="field"><label>Quantidade</label><input type="number" id="tQtd" value="${t.quantidade}" min="1"></div><div class="field"><label>Situação (pode marcar os dois)</label><label style="display:flex;align-items:center;gap:8px;font-weight:500;margin-bottom:6px"><input type="checkbox" id="tEntregue" ${t.entregue?'checked':''} style="width:auto"> ✓ Entregue</label><label style="display:flex;align-items:center;gap:8px;font-weight:500"><input type="checkbox" id="tDevolvido" ${t.devolvido?'checked':''} style="width:auto"> ✕ Devolvido</label></div><div class="modal-actions"><button class="btn btn-ghost" onclick="fecharModal()">Cancelar</button><button class="btn btn-primary" onclick="salvarEdicaoToalha('${id}')">Salvar</button></div>`); }
}
function salvarEdicaoVeiculo(id){ const v=DB.veiculos.find(v=>v.id===id); v.motorista=document.getElementById('eMotorista').value; v.empresa=document.getElementById('eEmpresa').value; v.observacao=document.getElementById('eObs').value; salvarDB(); fecharModal(); renderPagina(); toast('Veículo atualizado','success'); }
function salvarEdicaoVisitante(id){ const v=DB.visitantes.find(v=>v.id===id); v.nome=document.getElementById('eNome').value; v.empresa=document.getElementById('eEmpresa').value; v.observacao=document.getElementById('eObs').value; salvarDB(); fecharModal(); renderPagina(); toast('Visitante atualizado','success'); }
function salvarEdicaoToalha(id){ const t=DB.toalhas.find(t=>t.id===id); t.nome=document.getElementById('tNome').value; t.empresa=document.getElementById('tEmpresa').value; t.quantidade=parseInt(document.getElementById('tQtd').value)||1; t.entregue=document.getElementById('tEntregue').checked; t.devolvido=document.getElementById('tDevolvido').checked; salvarDB(); fecharModal(); renderToalhas(); toast('Registro atualizado','success'); }
/* ============ MÁSCARAS E AUTOCOMPLETE ============ */
function mascaraCPF(v){ v=v.replace(/\D/g,'').slice(0,11); let r=v; if(v.length>9)r=v.slice(0,3)+'.'+v.slice(3,6)+'.'+v.slice(6,9)+'-'+v.slice(9); else if(v.length>6)r=v.slice(0,3)+'.'+v.slice(3,6)+'.'+v.slice(6); else if(v.length>3)r=v.slice(0,3)+'.'+v.slice(3); return r; }
function mascaraRG(v){ v=v.replace(/\D/g,'').slice(0,10); let r=v; if(v.length>8)r=v.slice(0,2)+'.'+v.slice(2,5)+'.'+v.slice(5,8)+'-'+v.slice(8); else if(v.length>5)r=v.slice(0,2)+'.'+v.slice(2,5)+'.'+v.slice(5); else if(v.length>2)r=v.slice(0,2)+'.'+v.slice(2); return r; }
function aplicarMascaraDoc(input){ const tipo=document.getElementById('visTipoDoc'); const t=(window._tipoDoc)||(tipo?tipo.value:'CPF'); input.value=t==='CPF'?mascaraCPF(input.value):mascaraRG(input.value); }
function montarAutocomplete(inputId,listId,itens,onSelect){
  const input=document.getElementById(inputId), list=document.getElementById(listId);
  if(!input||!list)return;
  input.addEventListener('input',function(){ const q=this.value.trim().toLowerCase(); if(q.length<1){ list.classList.remove('open'); list.innerHTML=''; return; } const f=itens.filter(i=>i.busca.includes(q)).slice(0,6); if(!f.length){ list.classList.remove('open'); list.innerHTML=''; return; } window._autoItens=f; window._autoOnSelect=onSelect; list.innerHTML=f.map((i,idx)=>`<div class="autocomplete-item" onmousedown="event.preventDefault();selecionarAuto(${idx})"><span class="ac-icon">${i.icon}</span><div><div class="ac-title">${esc(i.titulo)}</div><div class="ac-sub">${i.sub}</div></div></div>`).join(''); list.classList.add('open'); });
  input.addEventListener('blur',function(){ setTimeout(()=>list.classList.remove('open'),180); });
}
function selecionarAuto(idx){ const itens=window._autoItens||[], on=window._autoOnSelect; if(itens[idx]&&on)on(itens[idx]); document.querySelectorAll('.autocomplete-list.open').forEach(x=>x.classList.remove('open')); }
function setTipoDoc(t){
  window._tipoDoc=t;
  ['tipoCPF','tipoRG','tipoOutro'].forEach(id=>{ const el=document.getElementById(id); if(el)el.classList.toggle('active',id==='tipoCPF'&&t==='CPF'||id==='tipoRG'&&t==='RG'||id==='tipoOutro'&&t==='Outro'); });
  const input=document.getElementById('visDoc');
  if(input){ input.placeholder=t==='CPF'?'000.000.000-00':(t==='RG'?'12.345.678-9':'Nº do documento'); aplicarMascaraDoc(input); }
}

/* ============ NOVO REGISTRO ============ */
function abrirNovoRegistro(){
  if(estado.pagina==='toalhas'){ abrirNovaToalha(); return; }
  if(estado.pagina==='veiculos'){ abrirRegistroEntrada('veiculo',null); return; }
  if(estado.pagina==='visitantes'){ abrirRegistroEntrada('visitante',null); return; }
  abrirModal(`<h3>Novo Registro</h3><p style="color:var(--texto2);margin-bottom:16px">O que deseja registrar?</p><div style="display:grid;gap:10px"><button class="btn btn-primary" onclick="abrirRegistroEntrada('veiculo',null)">🚗 Registrar Entrada de Veículo</button><button class="btn btn-primary" onclick="abrirRegistroEntrada('visitante',null)">👤 Registrar Visitante</button><button class="btn btn-outline" onclick="abrirRegistroSaida()">Registrar Saída</button></div>`);
}
function abrirRegistroSaida(){
  const dentro=DB.movimentacoes.filter(m=>m.movimento==='entrada'&&!m.dataSaida);
  abrirModal(`<h3>Registrar Saída</h3><div class="field"><label>Quem está no local</label><select id="saidaRef">${dentro.map(m=>{ const ref=m.tipo==='veiculo'?DB.veiculos.find(v=>v.id===m.refId):DB.visitantes.find(v=>v.id===m.refId); const nome=m.tipo==='veiculo'?ref.placa:ref.nome; return `<option value="${m.tipo}|${m.refId}">${m.tipo==='veiculo'?'🚗':'👤'} ${esc(nome)} (entrada ${m.horario})</option>`; }).join('')||'<option value="">Ninguém no local</option>'}</select></div><div class="modal-actions"><button class="btn btn-ghost" onclick="fecharModal()">Cancelar</button><button class="btn btn-primary" onclick="confirmarSaidaSelecionada()">Registrar Saída</button></div>`);
}
function confirmarSaidaSelecionada(){ const v=document.getElementById('saidaRef').value; if(!v){ toast('Ninguém no local','error'); return; } const [tipo,id]=v.split('|'); fecharModal(); registrarSaida(tipo,id); }
function abrirRegistroEntrada(tipo,id){
  const ref=tipo==='veiculo'?(id?DB.veiculos.find(v=>v.id===id):null):(id?DB.visitantes.find(v=>v.id===id):null);
  if(tipo==='veiculo'){
    abrirModal(`<h3>${ref?'Registrar Entrada — '+esc(ref.placa):'Cadastrar Veículo'}</h3>
      <div class="field autocomplete"><label>Placa *</label><input id="veicPlaca" value="${ref?esc(ref.placa):''}" placeholder="ABC1D23" style="text-transform:uppercase" oninput="this.value=this.value.toUpperCase();buscarPlacaAuto(this.value)"><div class="autocomplete-list" id="veicAutoList"></div></div>
      <div id="veicAuto"></div>
      <div class="field"><label>Nome do motorista *</label><input id="veicMotorista" value="${ref?esc(ref.motorista):''}"></div>
      <div class="field"><label>Empresa</label><input id="veicEmpresa" value="${ref?esc(ref.empresa):''}"></div>
      <div class="field"><label>Observação / Motivo da visita *</label><select id="veicObs"><option>Retirada de terra</option><option>Entulho</option><option>Entrega de material</option><option>Água</option></select></div>
      <div class="field"><label>Foto da placa</label><div class="photo-preview" id="veicFotoPrev">Sem foto</div><div class="photo-btns"><button class="btn btn-outline btn-sm" onclick="tirarFoto('veicFotoPrev','veicFoto')">📷 Tirar foto</button><button class="btn btn-outline btn-sm" onclick="document.getElementById('veicFotoFile').click()">📁 Selecionar arquivo</button><input type="file" id="veicFotoFile" accept="image/*" style="display:none" onchange="lerArquivoFoto(this,'veicFotoPrev','veicFoto')"></div><input type="hidden" id="veicFoto"></div>
      <div class="modal-actions"><button class="btn btn-ghost" onclick="fecharModal()">Cancelar</button><button class="btn btn-primary" onclick="salvarEntradaVeiculo()">Registrar Entrada</button></div>`);
    const veicItens=DB.veiculos.map(v=>{ const um=ultimaMov(v.id,'veiculo'), ms=movsDe(v.id,'veiculo'); return {busca:(v.placa+' '+v.motorista+' '+v.empresa).toLowerCase(),icon:'🚗',titulo:v.placa,sub:'Motorista: '+v.motorista+' • Empresa: '+v.empresa+' • '+ms.length+' visita(s) • Última: '+(um?fmtDataHora(um.data,um.horario):'—'),dados:v}; });
    montarAutocomplete('veicPlaca','veicAutoList',veicItens,function(item){
      document.getElementById('veicPlaca').value=item.dados.placa;
      document.getElementById('veicMotorista').value=item.dados.motorista;
      document.getElementById('veicEmpresa').value=item.dados.empresa;
      const ms=movsDe(item.dados.id,'veiculo'), dentro=estaDentro(item.dados.id,'veiculo');
      document.getElementById('veicAuto').innerHTML=`<div style="background:var(--verde-bg);padding:10px;border-radius:6px;font-size:13px;color:var(--verde-tx);margin-bottom:10px">✅ ${esc(item.dados.placa)} — ${esc(item.dados.motorista)} • ${ms.length} visita(s) • ${dentro?'🟢 Dentro do local':'Fora'}</div>`;
    });
  }else{
    abrirModal(`<h3>${ref?'Registrar Entrada — '+esc(ref.nome):'Cadastrar Visitante'}</h3>
      <div class="field autocomplete"><label>Nome completo *</label><input id="visNome" value="${ref?esc(ref.nome):''}" placeholder="Nome completo"><div class="autocomplete-list" id="visNomeList"></div></div>
      <div class="field"><label>Tipo de documento</label><div class="tipo-doc"><button type="button" class="chip active" id="tipoCPF" onclick="setTipoDoc('CPF')">CPF</button><button type="button" class="chip" id="tipoRG" onclick="setTipoDoc('RG')">RG</button><button type="button" class="chip" id="tipoOutro" onclick="setTipoDoc('Outro')">Outro</button></div></div>
      <div class="field autocomplete"><label>Nº do documento *</label><input id="visDoc" value="${ref?esc(ref.documento):''}" placeholder="000.000.000-00" oninput="aplicarMascaraDoc(this);buscarDocAuto(this.value)"><div class="autocomplete-list" id="visDocList"></div></div>
      <div id="visAuto"></div>
      <div class="field"><label>Empresa</label><input id="visEmpresa" value="${ref?esc(ref.empresa):''}"></div>
      <div class="field"><label>Observação / Motivo da visita</label><select id="visObs"><option>Reunião</option><option>Entrega de materiais</option><option>Visita técnica</option><option>Manutenção</option><option>Prestação de serviço</option><option>Entrega de documentos</option></select></div>
      <div class="field"><label>Foto do visitante</label><div class="photo-preview" id="visFotoPrev">Sem foto</div><div class="photo-btns"><button class="btn btn-outline btn-sm" onclick="tirarFoto('visFotoPrev','visFoto')">📷 Tirar foto</button><button class="btn btn-outline btn-sm" onclick="document.getElementById('visFotoFile').click()">📁 Selecionar arquivo</button><input type="file" id="visFotoFile" accept="image/*" style="display:none" onchange="lerArquivoFoto(this,'visFotoPrev','visFoto')"></div><input type="hidden" id="visFoto"></div>
      <div class="modal-actions"><button class="btn btn-ghost" onclick="fecharModal()">Cancelar</button><button class="btn btn-primary" onclick="salvarEntradaVisitante()">Registrar Entrada</button></div>`);
    window._tipoDoc='CPF';
    const nomeItens=DB.visitantes.map(v=>{ const ms=movsDe(v.id,'visitante'); return {busca:v.nome.toLowerCase(),icon:'👤',titulo:v.nome,sub:'Doc: '+v.documento+' • Empresa: '+v.empresa+' • '+ms.length+' visita(s)',dados:v}; });
    montarAutocomplete('visNome','visNomeList',nomeItens,function(item){
      document.getElementById('visNome').value=item.dados.nome;
      document.getElementById('visDoc').value=item.dados.documento;
      document.getElementById('visEmpresa').value=item.dados.empresa;
      const ms=movsDe(item.dados.id,'visitante');
      document.getElementById('visAuto').innerHTML=`<div style="background:var(--verde-bg);padding:10px;border-radius:6px;font-size:13px;color:var(--verde-tx);margin-bottom:10px">✅ ${esc(item.dados.nome)} • ${ms.length} visita(s) • Cadastro existente</div>`;
    });
    const docItens=DB.visitantes.map(v=>{ const ms=movsDe(v.id,'visitante'); return {busca:numeroDoc(v.documento),icon:'🪪',titulo:v.documento,sub:v.nome+' • Empresa: '+v.empresa+' • '+ms.length+' visita(s)',dados:v}; });
    montarAutocomplete('visDoc','visDocList',docItens,function(item){
      document.getElementById('visNome').value=item.dados.nome;
      document.getElementById('visDoc').value=item.dados.documento;
      document.getElementById('visEmpresa').value=item.dados.empresa;
      const ms=movsDe(item.dados.id,'visitante');
      document.getElementById('visAuto').innerHTML=`<div style="background:var(--verde-bg);padding:10px;border-radius:6px;font-size:13px;color:var(--verde-tx);margin-bottom:10px">✅ ${esc(item.dados.nome)} • ${ms.length} visita(s) • Cadastro existente</div>`;
    });
  }
}
function buscarPlacaAuto(val){
  const v=DB.veiculos.find(x=>x.placa===val.toUpperCase());
  document.getElementById('veicAuto').innerHTML=v?`<div style="background:var(--verde-bg);padding:10px;border-radius:6px;font-size:13px;color:var(--verde-tx);margin-bottom:10px">✅ Placa encontrada: ${esc(v.motorista)} — ${esc(v.empresa)}. Usando cadastro existente.</div>`:'';
}
function buscarDocAuto(val){
  const v=DB.visitantes.find(x=>numeroDoc(x.documento)===numeroDoc(val));
  document.getElementById('visAuto').innerHTML=v?`<div style="background:var(--verde-bg);padding:10px;border-radius:6px;font-size:13px;color:var(--verde-tx);margin-bottom:10px">✅ Documento encontrado: ${esc(v.nome)} — ${esc(v.empresa)}. Usando cadastro existente.</div>`:'';
}
function registrarSaida(tipo,id){
  const u=getUsuario();
  const ms=movsDe(id,tipo);
  const aberta=ms.find(m=>m.movimento==='entrada'&&!m.dataSaida);
  if(aberta){ aberta.dataSaida=hoje(); aberta.horarioSaida=agora(); aberta.usuarioSaida=u.nome; }
  else { DB.movimentacoes.push({id:uid(),tipo,refId:id,data:hoje(),horario:agora(),movimento:'saida',observacao:null,usuario:u.nome,dataSaida:hoje(),horarioSaida:agora(),usuarioSaida:u.nome}); }
  salvarDB(); renderPagina(); toast('Saída registrada às '+agora(),'success');
}
function salvarEntradaVeiculo(){
  const u=getUsuario();
  let placa=document.getElementById('veicPlaca').value.trim().toUpperCase();
  const motorista=document.getElementById('veicMotorista').value.trim(), empresa=document.getElementById('veicEmpresa').value.trim();
  const obs=document.getElementById('veicObs').value, foto=document.getElementById('veicFoto').value;
  if(!placa||!motorista){ toast('Preencha placa e motorista','error'); return; }
  let veic=DB.veiculos.find(v=>v.placa===placa);
  if(!veic){ veic={id:uid(),placa,motorista,empresa,foto,observacao:obs,dataCadastro:hoje(),usuario:u.nome}; DB.veiculos.push(veic); }
  else { veic.motorista=motorista; veic.empresa=empresa; if(foto)veic.foto=foto; }
  if(estaDentro(veic.id,'veiculo')){ toast('Este veículo já está dentro do local','error'); return; }
  DB.movimentacoes.push({id:uid(),tipo:'veiculo',refId:veic.id,data:hoje(),horario:agora(),movimento:'entrada',observacao:obs,usuario:u.nome,dataSaida:null,horarioSaida:null,usuarioSaida:null});
  salvarDB(); fecharModal(); renderPagina(); toast('Entrada registrada às '+agora(),'success');
}
function salvarEntradaVisitante(){
  const u=getUsuario();
  const nome=document.getElementById('visNome').value.trim(), doc=document.getElementById('visDoc').value.trim();
  const empresa=document.getElementById('visEmpresa').value.trim(), obs=document.getElementById('visObs').value, foto=document.getElementById('visFoto').value;
  if(!nome||!doc){ toast('Preencha nome e documento','error'); return; }
  let vis=DB.visitantes.find(v=>numeroDoc(v.documento)===numeroDoc(doc));
  if(!vis){ vis={id:uid(),nome,documento:doc,empresa,foto,observacao:obs,dataCadastro:hoje(),usuario:u.nome}; DB.visitantes.push(vis); }
  else { vis.nome=nome; vis.empresa=empresa; if(foto)vis.foto=foto; }
  if(estaDentro(vis.id,'visitante')){ toast('Este visitante já está dentro','error'); return; }
  DB.movimentacoes.push({id:uid(),tipo:'visitante',refId:vis.id,data:hoje(),horario:agora(),movimento:'entrada',observacao:obs,usuario:u.nome,dataSaida:null,horarioSaida:null,usuarioSaida:null});
  salvarDB(); fecharModal(); renderPagina(); toast('Entrada registrada às '+agora(),'success');
}
/* ============ TOALHAS: NOVO REGISTRO (com autocomplete) ============ */

      <label style="display:flex;align-items:center;gap:8px;font-weight:500"><input type="checkbox" id="tDevolvido" style="width:auto"> ✕ Devolvido</label>

function salvarToalha(){
  const u=getUsuario();
  const nome=document.getElementById('tNome').value.trim(), empresa=document.getElementById('tEmpresa').value.trim();
  const resp=document.getElementById('tResp').value.trim()||u.nome, qtd=parseInt(document.getElementById('tQtd').value)||1;
  const entregue=document.getElementById('tEntregue').checked;
  const devolvido=document.getElementById('tDevolvido').checked;
  const agoraS=agora();
  if(!nome){ toast('Preencha o nome da pessoa','error'); return; }
  if(!entregue&&!devolvido){ toast('Marque Entregue e/ou Devolvido','error'); return; }
  const data=hoje(), mes=data.slice(0,7);
  DB.toalhas.push({id:uid(),mes,data,horario:agoraS,nome,empresa,responsavel:resp,quantidade:qtd,entregue,devolvido,observacao:'',usuario:u.nome});
  salvarDB(); fecharModal();
  estado.mesAtual=mes; estado.diaToalha=data; estado.pagToalha=1; estado.abaToalha='diario';
  renderToalhas(); toast('Registro salvo às '+agoraS,'success');
}
/* ============ FOTO (câmera traseira / arquivo) ============ */
function tirarFoto(prevId,inputId){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){ toast('Câmera não suportada neste dispositivo','error'); return; }
  abrirModal(`<h3>Tirar foto</h3><video id="camVideo" autoplay muted playsinline></video><p id="camStatus" style="color:var(--texto2);font-size:12px;margin-bottom:10px">Abrindo câmera traseira...</p><div class="modal-actions"><button class="btn btn-ghost" onclick="pararCam()">Cancelar</button><button class="btn btn-primary" id="btnCapturar" onclick="capturarFoto('${prevId}','${inputId}')" disabled>📸 Capturar</button></div>`);
  const video=document.getElementById('camVideo'), btn=document.getElementById('btnCapturar'), status=document.getElementById('camStatus');
  const preferencias=[{video:{facingMode:{ideal:'environment'}}},{video:true}];
  let tentativa=0;
  function iniciar(){
    navigator.mediaDevices.getUserMedia(preferencias[tentativa]).then(s=>{
      window._camStream=s; video.srcObject=s;
      video.addEventListener('loadedmetadata',function(){ try{ video.play(); }catch(e){} btn.disabled=false; status.textContent='Câmera pronta. Toque em Capturar.'; },{once:true});
      setTimeout(()=>{ if(video.readyState>=1){ btn.disabled=false; status.textContent='Câmera pronta. Toque em Capturar.'; } },900);
    }).catch(()=>{ if(tentativa<preferencias.length-1){ tentativa++; iniciar(); } else { status.textContent='Não foi possível acessar a câmera.'; toast('Não foi possível acessar a câmera','error'); } });
  }
  iniciar();
}
function pararCam(){ if(window._camStream){ try{ window._camStream.getTracks().forEach(t=>t.stop()); }catch(e){} window._camStream=null; } fecharModal(); }
function capturarFoto(prevId,inputId){
  const v=document.getElementById('camVideo');
  if(!v||!v.videoWidth||v.videoWidth===0){ toast('Aguardando a câmera. Tente novamente em instantes.','error'); return; }
  const canvas=document.createElement('canvas'); canvas.width=v.videoWidth; canvas.height=v.videoHeight;
  canvas.getContext('2d').drawImage(v,0,0);
  const data=canvas.toDataURL('image/jpeg',0.9);
  document.getElementById(prevId).innerHTML=`<img src="${data}" alt="foto">`;
  document.getElementById(inputId).value=data;
  pararCam(); toast('Foto capturada','success');
}
function lerArquivoFoto(input,prevId,inputId){ const f=input.files[0]; if(!f)return; const r=new FileReader(); r.onload=e=>{ document.getElementById(prevId).innerHTML=`<img src="${e.target.result}">`; document.getElementById(inputId).value=e.target.result; }; r.readAsDataURL(f); }

/* ============ MODAL / CONFIRM ============ */
function abrirModal(html){ document.getElementById('modalBox').innerHTML=html; document.getElementById('modalOverlay').classList.add('open'); }
function fecharModal(){ if(window._camStream){ try{ window._camStream.getTracks().forEach(t=>t.stop()); }catch(e){} window._camStream=null; } document.getElementById('modalOverlay').classList.remove('open'); }
function fecharConfirm(){ document.getElementById('confirmOverlay').classList.remove('open'); }
document.getElementById('modalOverlay').addEventListener('click',e=>{ if(e.target.id==='modalOverlay')fecharModal(); });
document.getElementById('confirmOverlay').addEventListener('click',e=>{ if(e.target.id==='confirmOverlay')fecharConfirm(); });

/* ============ PAGINAÇÃO ============ */
function paginationHtml(pag,totalPag,total,stateKey){
  let btns='<button '+(pag<=1?'disabled':'')+' onclick="mudarPag('+(pag-1)+',\''+stateKey+'\')">‹</button>';
  for(let i=1;i<=totalPag;i++)btns+=`<button class="${i===pag?'active':''}" onclick="mudarPag(${i},'${stateKey}')">${i}</button>`;
  btns+='<button '+(pag>=totalPag?'disabled':'')+' onclick="mudarPag('+(pag+1)+',\''+stateKey+'\')">›</button>';
  const ini=(pag-1)*10+1, fim=Math.min(pag*10,total);
  return `<div class="pagination"><div class="info">Mostrando ${total?ini:0} a ${fim} de ${total} registros</div><div class="pages">${btns}</div></div>`;
}
function mudarPag(p,key){ estado[key]=p; renderPagina(); }

/* ============ LOGIN / SESSÃO ============ */
function fazerLogin(){
  const usuario=document.getElementById('loginEmail').value.trim(), senha=document.getElementById('loginSenha').value;
  if(usuario!=='Portaria'||senha!=='Limoema26'){ toast('Usuário ou senha incorretos','error'); return; }
  let u=DB.usuarios.find(x=>x.nome==='Portaria');
  if(!u){ u={id:uid(),nome:'Portaria',email:'portaria@lindenberg.com',senha:'Limoema26',funcao:'Portaria',foto:'',ativo:true}; DB.usuarios.push(u); salvarDB(); }
  sessao=u.id; storageSet(SES_KEY,u.id);
  document.getElementById('login').style.display='none'; document.getElementById('app').style.display='block';
  navegar('inicio'); atualizarRelogio();
}
function sair(){ sessao=null; storageRemove(SES_KEY); document.getElementById('app').style.display='none'; document.getElementById('login').style.display='flex'; }
function toggleSidebar(force){ const sb=document.getElementById('sidebar'), ov=document.getElementById('sidebarOverlay'); const abrir=force!==undefined?force:!sb.classList.contains('open'); sb.classList.toggle('open',abrir); if(ov)ov.classList.toggle('show',abrir); }
function logoLoginFalhou(img){
  if(!img.dataset.tentouJpg){ img.dataset.tentouJpg='1'; img.src='logocontrole.jpg'; }
  else { img.style.display='none'; const fb=document.getElementById('loginFallback'); if(fb)fb.style.display='block'; }
}

/* ============ RELÓGIO / TEMPO ============ */
function atualizarRelogio(){
  const d=new Date(), dias=['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'];
  const meses=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
  const h=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+':'+String(d.getSeconds()).padStart(2,'0');
  document.getElementById('clock').innerHTML=`<b>${h}</b>${dias[d.getDay()]}, ${d.getDate()} de ${meses[d.getMonth()]} de ${d.getFullYear()}`;
  document.querySelectorAll('.tempo').forEach(el=>{ el.textContent=tempoDecorrido(el.dataset.d,el.dataset.h); });
}

/* ============ INIT ============ */
try{
  carregarDB();
  const s=storageGet(SES_KEY);
  if(s&&DB.usuarios.find(u=>u.id===s)){ sessao=s; document.getElementById('login').style.display='none'; document.getElementById('app').style.display='block'; navegar('inicio'); }
  else { document.getElementById('login').style.display='flex'; }
  atualizarRelogio();
  setInterval(atualizarRelogio,1000);
  document.getElementById('btnEntrar').addEventListener('click',fazerLogin);
  document.getElementById('loginSenha').addEventListener('keydown',function(e){ if(e.key==='Enter')fazerLogin(); });
}catch(err){
  console.error('Erro ao iniciar o sistema:',err);
  document.getElementById('login').style.display='flex';
}
</script>
